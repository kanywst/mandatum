version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - usetesting

  settings:
    gosec:
      excludes:
        # G115 (integer overflow on conversion) is noisy on claim arithmetic
        # where bounds are already checked. Re-enable if that stops being true.
        - G115
    revive:
      rules:
        - name: exported
          severity: warning
        - name: error-strings
        - name: errorf
        - name: context-as-argument
        - name: indent-error-flow

  exclusions:
    rules:
      # Test fixtures deliberately construct malformed input.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
