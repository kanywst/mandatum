name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never cancel a release in flight. A half-published tag is worse than a slow
# one, so this serialises rather than superseding.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify the tag before publishing anything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Current Go: go-licenses needs a newer toolchain than the library
          # declares as its minimum. The oldstable job in ci.yml is what keeps
          # that minimum honest.
          go-version: stable
          # A release must not consume a cache another workflow can write.
          # Rebuilding from scratch costs a minute; a poisoned cache costs
          # the signature its meaning.
          cache: false
      - run: make build
      - run: make test
      - name: Fuzz the parsers and the verifier
        # A tag is the last point where a crasher is cheap. Short, because
        # this gates a release; the nightly campaign is where depth comes from.
        run: make fuzz FUZZTIME=60s
      - name: Dependency licenses
        run: |
          go install github.com/google/go-licenses@latest
          make license-check
      - name: The release notes can be built from the changelog
        # The same script the publish job runs, called here for its exit
        # status. A tag with no changelog section fails before anything is
        # published rather than at the step that would have used it.
        run: ./hack/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

  release:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its artifacts
      id-token: write  # cosign keyless: exchanged for a short-lived Sigstore certificate, never a stored key
      attestations: write  # record build provenance for the source archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="mandatum-${GITHUB_REF_NAME}/" \
            -o "dist/mandatum-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"

      - name: Generate an SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          output-file: dist/mandatum-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist
        run: sha256sum ./* > checksums.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        # Signing the checksum file transitively covers every artifact, and
        # keeps one signature to verify rather than one per file.
        #
        # A Sigstore bundle rather than a separate .sig and .pem: cosign v3
        # deprecated those flags and, with the new bundle format, ignores
        # them. On v0.1.0-rc.1 that surfaced as an outright error, because
        # --bundle then defaulted to an empty path. Had it not, the step
        # would have gone green having written no signature.
        run: |
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/mandatum-*.tar.gz'

      # `gh release` rather than a third-party action. The release path is
      # the one place where an extra dependency can substitute artifacts, and
      # the CLI is already on the runner.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The notes are this version's changelog section, with its links
          # resolved against the tag, plus how to verify the artifacts. A
          # release page that says "see CHANGELOG.md" makes whoever is
          # deciding whether to upgrade leave the page to find out what they
          # are being offered.
          notes=$(mktemp)
          ./hack/release-notes.sh "${TAG#v}" > "$notes"
          # A SemVer pre-release identifier is the hyphen after the patch
          # number. VERSIONING.md says a pre-release carries no compatibility
          # promise and is not supported, and a release GitHub serves as
          # "Latest" contradicts that no matter what the notes say. v0.1.0-rc.1
          # and rc.2 were both published as full releases because this was
          # decided by hand and nobody was checking.
          prerelease=()
          case "$TAG" in
            *-*) prerelease=(--prerelease) ;;
          esac

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$notes" \
            "${prerelease[@]}" \
            dist/*
