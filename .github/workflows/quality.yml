name: quality

# Checks on the things that check everything else. A broken workflow, a shell
# script with an unquoted expansion, or a dead link in the specification are
# all invisible to the Go toolchain.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Tooling is built with the current Go, not the module's declared
          # minimum: govulncheck, go-licenses and actionlint each require a
          # newer toolchain than the library does, and pinning them to the
          # minimum only breaks the tools.
          go-version: stable

      - name: actionlint
        # Catches the class of mistake that only shows up when a workflow
        # runs: a bad expression, an undefined output, a shell error in a
        # run block.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" -color

      - name: zizmor
        # Static analysis for workflow security: injectable expressions,
        # over-broad permissions, unpinned actions, credential persistence.
        # A project about verifiable delegation should not be handing its own
        # CI more authority than it needs.
        run: |
          pipx install zizmor
          zizmor --persona=pedantic --format plain .github/workflows/

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --severity=style hack/*.sh

  spelling:
    name: spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      # Skips the Japanese translations, whose words codespell does not know,
      # and the license text, which is not ours to correct. "crasher" is
      # fuzzing's word for an input that crashes a target, not a typo.
      - name: codespell
        run: |
          pipx install codespell
          codespell \
            --skip='./.git,./LICENSE,*.ja.md,go.sum' \
            --ignore-words-list='mandatum,crasher,crashers,ist,nd,te' \
            .

  links:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Relative links matter most: the documents cross-reference each
          # other heavily, and a broken one sends a reader to a 404 in a
          # specification. External links are checked too but do not fail the
          # build on a transient outage.
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude-path ./LICENSE
            --max-retries 2
            './**/*.md'
          fail: true
        continue-on-error: true

      - name: release notes build for every changelog entry
        # Every entry, not just the one a tag is about, because the boundary
        # a section extractor gets wrong is the last one: the oldest entry
        # has no heading below it and runs into the file's link definitions.
        # That is the entry a project's first release publishes, and the
        # only one never exercised until it matters.
        run: |
          set -euo pipefail
          grep -oE '^## \[[^]]+\]' CHANGELOG.md |
            sed -E 's/^## \[//; s/\]$//' |
            grep -v '^Unreleased$' |
            while IFS= read -r version; do
              notes=$(./hack/release-notes.sh "$version")
              if printf '%s\n' "$notes" | grep -qE '^\[[^]]+\]:[[:space:]]'; then
                echo "::error::the notes for ${version} carry the changelog's link definitions"
                exit 1
              fi
              echo "ok: ${version}"
            done

      - name: a section boundary inside a code fence is not a boundary
        # The check above cannot catch this one. A boundary matched inside a
        # fence truncates the section, which *removes* the offending line
        # rather than leaking it, so the output is a short entry rather than
        # a wrong one and nothing fails. This changelog quotes JSON claim
        # sets and JWS payloads, so a fence holding a line that starts `## `
        # is a question of when, not whether.
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          cat > "${fixture}/CHANGELOG.md" <<'FIXTURE'
          # Changelog

          ## [9.9.9] - 2026-01-01

          Before the fence.

          ```markdown
          ## [0.0.1] - a heading inside an example
          [^1]: a footnote definition inside an example
          ```

          Between the fences.

          ~~~markdown
          ## [0.0.2] - a heading inside a tilde fence
          ~~~

          After the fence.

          ## [9.9.8] - 2026-01-01

          The older entry, which must not appear.

          [9.9.9]: https://example.com/9.9.9
          FIXTURE

          notes=$(CHANGELOG_FILE="${fixture}/CHANGELOG.md" ./hack/release-notes.sh 9.9.9)

          for needle in 'Before the fence.' 'Between the fences.' 'After the fence.'; do
            if ! printf '%s\n' "$notes" | grep -qF "$needle"; then
              echo "::error::the section was truncated at a boundary inside a code fence"
              exit 1
            fi
          done
          if printf '%s\n' "$notes" | grep -qF 'The older entry'; then
            echo "::error::the section ran past its own end into the next entry"
            exit 1
          fi

          # A fence that never closes would otherwise swallow the rest of the
          # file in silence, since every boundary below it is inside a fence.
          cat > "${fixture}/unclosed.md" <<'FIXTURE'
          # Changelog

          ## [9.9.9] - 2026-01-01

          ```json
          {"never": "closed"}
          FIXTURE
          if CHANGELOG_FILE="${fixture}/unclosed.md" ./hack/release-notes.sh 9.9.9 > /dev/null 2>&1; then
            echo "::error::an entry with an unclosed code fence was accepted"
            exit 1
          fi

          echo "ok: a fenced boundary is content, and an unclosed fence is an error"

      - name: documents do not reference documents that do not exist
        # A sentence in the present tense about a file nobody has written is
        # the same defect as a claim the code does not honour, and it has
        # appeared three times here. The author of such a sentence intends to
        # write the file, which is why the author never notices.
        run: ./hack/check-doc-refs.sh

      - name: relative links resolve
        # The step above tolerates the internet being unreliable. This one
        # does not tolerate a link into our own tree being wrong, because
        # that is entirely within the project's control.
        run: |
          status=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            # Markdown links that are not URLs, anchors or mailto.
            grep -oE '\]\([^)#][^)]*\)' "$file" 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | grep -vE '^(https?:|mailto:|$)' \
              | while IFS= read -r target; do
                  [ -z "$target" ] && continue
                  if [ ! -e "$dir/$target" ]; then
                    echo "::error file=$file::broken relative link: $target"
                    exit 1
                  fi
                done || status=1
          done < <(find . -name '*.md' -not -path './.git/*')
          exit $status
