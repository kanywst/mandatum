name: i18n

# A stale translation is more dangerous than a missing one, because a reader
# cannot tell the difference. Each translation records a digest of the English
# source it was made from; this reports the ones whose source has moved on.
#
# Advisory only. An English correction must not wait for a translator, and a
# maintainer who does not speak the language should still be able to fix a
# typo. The script exits zero; it leaves annotations and a summary.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translation-drift:
    name: translations track their source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
          fetch-depth: 0

      - name: Translations record the source they were made from
        # Deterministic rather than heuristic: each translation records a
        # digest of its English source, so this reports exactly which ones
        # have fallen behind instead of guessing from which files a pull
        # request happened to touch.
        run: ./hack/translations.sh check | tee -a "$GITHUB_STEP_SUMMARY"
