name: fuzz-nightly

# The per-pull-request pass is 60 seconds per target, which catches
# regressions but not much else. This runs a real campaign and keeps any
# crasher it finds, so the failure is reproducible rather than a log line
# saying something went wrong overnight.

on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to fuzz each target
        required: false
        default: 15m

permissions:
  contents: read

# A campaign still running when the next one is due is superseded rather than
# run alongside it: two long fuzz jobs on the same code find the same things.
concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - ./pkg/mda
          - ./pkg/verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '15m' }}
          # Through the environment rather than interpolated into the script.
          # These values are ours today, but a workflow that splices
          # expressions into a shell body is one edit from command injection.
          PACKAGE: ${{ matrix.package }}
        run: |
          status=0
          for target in $(go test -list 'Fuzz.*' "$PACKAGE" | grep '^Fuzz' || true); do
            echo "::group::$target"
            go test -run '^$' -fuzz "^${target}$" -fuzztime="$FUZZTIME" "$PACKAGE" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Keep any crasher
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers-${{ strategy.job-index }}
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 30
