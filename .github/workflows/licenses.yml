name: licenses

# CNCF sandbox applications are auto-closed when a transitive dependency
# carries a license outside the CNCF allowlist. Catching that on the pull
# request that introduces the dependency costs a dependency swap; catching it
# at application time costs a rewrite.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Upstream projects relicense. Re-check weekly rather than only on change.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  allowlist:
    name: dependency licenses are on the CNCF allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: Check
        run: make license-check

  project-license:
    name: project license is unmodified Apache-2.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: LICENSE matches the canonical Apache-2.0 text
        run: |
          expected=b40930bbcf80744c86c46a12bc9da056641d722716c378f5659b9e555ef833e1
          actual=$(sha256sum LICENSE | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "LICENSE has been modified."
            echo "  expected sha256 $expected"
            echo "  actual   sha256 $actual"
            echo
            echo "The project license must be the unmodified Apache-2.0 text."
            exit 1
          fi
          echo "LICENSE is the canonical Apache-2.0 text."

  dependency-review:
    name: new dependencies are allowlisted
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Blocks at the point a dependency is proposed. hack/check-licenses.sh
      # scans what is already there; this refuses the pull request that would
      # add something outside the CNCF allowlist, which is a much cheaper
      # place to say no.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-licenses: >-
            Apache-2.0, 0BSD, BSD-2-Clause, BSD-3-Clause, MIT, MIT-0, ISC,
            OpenSSL, PostgreSQL, Python-2.0, UPL-1.0, X11, Zlib
          comment-summary-in-pr: on-failure
          fail-on-severity: low
