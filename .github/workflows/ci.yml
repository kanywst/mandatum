name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # One job on the previous Go release, so the module's declared
          # minimum stays true rather than drifting up silently with the
          # runner image.
          - os: ubuntu-latest
            go: oldstable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go build ./...
      - run: go test -race -count=1 ./...

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A floor rather than a target. Coverage is a poor measure of test
      # quality, but a sharp drop in a package that decides authorization is
      # worth stopping to look at, and the alternative is nobody noticing.
      - name: Statements covered must not fall below the floor
        env:
          FLOOR: "90"
        run: |
          go test -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${total}% (floor ${FLOOR}%)"
          awk -v t="$total" -v f="$FLOOR" 'BEGIN { exit (t + 0 >= f + 0) ? 0 : 1 }' || {
            echo "::error::coverage ${total}% is below the ${FLOOR}% floor"
            go tool cover -func=coverage.out | awk '$3 + 0 < 80'
            exit 1
          }

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  tidy:
    name: dependencies are tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make tidy

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A short pass on every pull request catches regressions cheaply. Longer
      # campaigns run on a schedule; see fuzz-nightly.yml.
      - run: make fuzz FUZZTIME=60s

  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
      - run: npx --yes markdownlint-cli2 "**/*.md"

  dco:
    name: sign-off
    runs-on: ubuntu-latest
    # Dependabot does not sign off, and cannot: the DCO is a statement about
    # a person's right to submit the work. Requiring it of the bot leaves
    # every dependency bump red on a required check, which trains whoever is
    # merging to override the check rather than read it. A version bump to a
    # SHA-pinned action carries no copyright the DCO exists to cover.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this repository pushes, so the checkout token has no
          # reason to outlive the step that used it.
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "missing Signed-off-by: $(git log -1 --oneline "$sha")"
              missing=1
            fi
          done < <(git rev-list "$BASE..$HEAD")
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Add a sign-off with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
